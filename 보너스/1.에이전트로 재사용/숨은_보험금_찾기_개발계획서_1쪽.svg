<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="848" viewBox="0 0 842 595" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" role="img"><title>숨은 보험금 찾기 · 자료를 등록하고 약관 근거 찾기</title>
<rect x="0" y="0" width="842" height="595" rx="0" fill="#F4F8F5"/>
<text x="30" y="28" font-size="10" font-weight="700" fill="#21695D">개발 순서 길잡이　 /　 인포그래픽 개발 계획서</text>
<text x="770" y="28" font-size="12" font-weight="700" fill="#21695D">1 / 2</text>
<text x="28" y="65" font-size="30" font-weight="700" fill="#193B38">숨은 보험금 찾기</text>
<text x="292" y="63" font-size="16" font-weight="700" fill="#49665F">자료를 등록하고 약관 근거 찾기</text>
<rect x="30" y="80" width="782" height="25" rx="5" fill="#DFEEE7"/>
<text x="41" y="97" font-size="10.3" font-weight="700" fill="#193B38">가장 먼저 만들 기능</text>
<text x="155" y="97" font-size="10.4" font-weight="400" fill="#193B38">빈 등록 화면부터 만들어요. 약관·증권·보험정보가 있어야 검색을 시험할 수 있어요.</text>
<rect x="30" y="107" width="782" height="25" rx="5" fill="#FFF1CA"/>
<text x="41" y="124" font-size="10.3" font-weight="700" fill="#193B38">가장 중요한 기능</text>
<text x="155" y="124" font-size="10.4" font-weight="400" fill="#193B38">약관 근거와 내 가입 특약을 대조해요. 그래야 내 계약에 해당할 보장과 금액을 살펴볼 수 있어요.</text>
<rect x="30" y="149" width="247" height="43" rx="8" fill="#193B38"/>
<circle cx="51" cy="170" r="12" fill="#21695D"/><g transform="translate(51 170)">
<path d="M-7 -7h14v14h-14z M-7 -3h14" stroke="white" stroke-width="1.3" fill="none"/>
</g>
<text x="73" y="176" font-size="14" font-weight="700" fill="white">01　첫 화면</text>
<path d="M280 170h13l-4 -4m4 4l-4 4" stroke="#21695D" stroke-width="1" fill="none"/>
<rect x="297" y="149" width="247" height="43" rx="8" fill="#193B38"/>
<circle cx="318" cy="170" r="12" fill="#21695D"/><g transform="translate(318 170)">
<path d="M-7 -7h14v14h-14z M-4 -2h8 M-4 2h6" stroke="white" stroke-width="1.3" fill="none"/>
</g>
<text x="340" y="176" font-size="14" font-weight="700" fill="white">02　자료 등록</text>
<path d="M547 170h13l-4 -4m4 4l-4 4" stroke="#21695D" stroke-width="1" fill="none"/>
<rect x="564" y="149" width="247" height="43" rx="8" fill="#193B38"/>
<circle cx="585" cy="170" r="12" fill="#21695D"/><g transform="translate(585 170)">
<path d="M3 3l4 4 M4 -1a5 5 0 1 0 -10 0a5 5 0 1 0 10 0" stroke="white" stroke-width="1.3" fill="none"/>
</g>
<text x="607" y="176" font-size="14" font-weight="700" fill="white">03　근거 검색</text>
<rect x="30" y="210" width="782" height="28" rx="4" fill="#21695D"/>
<text x="40" y="229" font-size="11" font-weight="700" fill="white">단계·제목</text>
<text x="167" y="229" font-size="11" font-weight="700" fill="white">할 일</text>
<text x="383" y="229" font-size="11" font-weight="700" fill="white">결과물</text>
<text x="550" y="229" font-size="11" font-weight="700" fill="white">완료 기준</text>
<path d="M534 225l3 4 7 -11" stroke="white" stroke-width="1.6" fill="none"/>
<rect x="30" y="238" width="782" height="91" rx="0" fill="white"/>
<path d="M157 245v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<path d="M373 245v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<path d="M524 245v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<text x="40" y="259" font-size="12" font-weight="700" fill="#21695D">01</text>
<text x="40" y="282" font-size="12" font-weight="700" fill="#193B38">첫 화면</text>
<text x="167" y="258" font-size="10.4" font-weight="400" fill="#193B38">오프라인에서 열리는 HTML 한 파일에</text>
<text x="167" y="272.5" font-size="10.4" font-weight="400" fill="#193B38">PC·모바일용 빈 등록 화면을 만들어요.</text>
<text x="383" y="258" font-size="10.4" font-weight="400" fill="#193B38">필수자료 3종이 먼저</text>
<text x="383" y="272.5" font-size="10.4" font-weight="400" fill="#193B38">보이는 첫 화면</text>
<text x="534" y="258" font-size="10.4" font-weight="400" fill="#193B38">① 인터넷을 끄고 파일을 열어요. 로그인이나 서버 실행</text>
<text x="534" y="272.5" font-size="10.4" font-weight="400" fill="#193B38">없이 빈 첫 화면이 떠야 해요.</text>
<rect x="30" y="329" width="782" height="91" rx="0" fill="#EBF3ED"/>
<path d="M157 336v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<path d="M373 336v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<path d="M524 336v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<text x="40" y="350" font-size="12" font-weight="700" fill="#21695D">02</text>
<text x="40" y="373" font-size="12" font-weight="700" fill="#193B38">자료 등록</text>
<text x="167" y="349" font-size="10.4" font-weight="400" fill="#193B38">약관·증권·보험정보를 등록하고 태그와</text>
<text x="167" y="363.5" font-size="10.4" font-weight="400" fill="#193B38">특약을 연결해요. PDF 글자는 페이지별로</text>
<text x="167" y="378" font-size="10.4" font-weight="400" fill="#193B38">저장하고, 읽히지 않는 쪽은 직접</text>
<text x="167" y="392.5" font-size="10.4" font-weight="400" fill="#193B38">입력해요.</text>
<text x="383" y="349" font-size="10.4" font-weight="400" fill="#193B38">자료별 등록 건수와 빠진</text>
<text x="383" y="363.5" font-size="10.4" font-weight="400" fill="#193B38">자료 안내</text>
<text x="534" y="349" font-size="10.4" font-weight="400" fill="#193B38">② 두 종류만 등록하면 버튼·Enter 검색이 잠겨요. 세</text>
<text x="534" y="363.5" font-size="10.4" font-weight="400" fill="#193B38">종류가 각각 1건 이상이면 검색 버튼이 켜져요.</text>
<rect x="30" y="420" width="782" height="91" rx="0" fill="white"/>
<path d="M157 427v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<path d="M373 427v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<path d="M524 427v77" stroke="#D7E4DC" stroke-width="0.6" fill="none"/>
<text x="40" y="441" font-size="12" font-weight="700" fill="#21695D">03</text>
<text x="40" y="464" font-size="12" font-weight="700" fill="#193B38">근거 검색</text>
<text x="167" y="440" font-size="10.4" font-weight="400" fill="#193B38">질병명·상해명·진단코드 하나로 약관을</text>
<text x="167" y="454.5" font-size="10.4" font-weight="400" fill="#193B38">찾고, 가입한 특약·적용 기간과 대조해요.</text>
<text x="167" y="469" font-size="10.4" font-weight="400" fill="#193B38">여러 태그는 하나라도 맞으면 포함해요.</text>
<text x="383" y="440" font-size="10.4" font-weight="400" fill="#193B38">관련 보장 카드와 약관</text>
<text x="383" y="454.5" font-size="10.4" font-weight="400" fill="#193B38">조항·페이지</text>
<text x="534" y="440" font-size="10.4" font-weight="400" fill="#193B38">③ 질병명이나 코드로 검색하면 미리 골라 둔 보장과</text>
<text x="534" y="454.5" font-size="10.4" font-weight="400" fill="#193B38">근거 조항이 보여요.</text>
<text x="534" y="469" font-size="10.4" font-weight="400" fill="#193B38">④ 태그 두 개를 고르면 둘 중 하나만 붙은 자료도 나와요.</text>
<text x="30" y="537" font-size="11" font-weight="700" fill="#21695D">시험 준비</text>
<text x="103" y="537" font-size="10.8" font-weight="400" fill="#193B38">개인정보를 가린 약관·증권, 직접 입력할 보험정보, 원문에서 확인한 조항 한 개와 손계산표를 준비해요.</text>
<text x="30" y="562" font-size="11" font-weight="700" fill="#21695D">다음 장</text>
<text x="103" y="562" font-size="10.8" font-weight="400" fill="#193B38">찾은 보장이 실제 가입 특약과 연결되면, 지급 조건을 입력하고 금액 계산을 시작해요.</text>
<text x="30" y="583" font-size="9" font-weight="400" fill="#49665F">기획서 5절　·　①–⑧은 직접 시험할 8개 완료 기준이며 현재 모두 미시험이에요.</text>
</svg>